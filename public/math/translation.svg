<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" fill="white"/><text x="500" y="45" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700">Translation: Slide the Figure</text><polygon points="170,390 300,390 170,260" fill="none" stroke="#2563eb" stroke-width="7"/><polygon points="590,280 720,280 590,150" fill="none" stroke="#dc2626" stroke-width="7"/><line x1="250" y1="330" x2="650" y2="220" stroke="#111" stroke-width="3" marker-end="url(#a)"/><text x="370" y="245" font-family="Arial" font-size="25">same distance, same direction</text><text x="230" y="435" text-anchor="middle" font-family="Arial" font-size="24" fill="#2563eb">Pre-image</text><text x="655" y="325" text-anchor="middle" font-family="Arial" font-size="24" fill="#dc2626">Image</text><text x="500" y="485" text-anchor="middle" font-family="Arial" font-size="23">Rigid transformation: size and shape stay the same</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs></svg>